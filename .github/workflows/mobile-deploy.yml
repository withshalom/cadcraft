# Builds the browser version from the `mobile` branch and publishes it to GitHub Pages at
# mobile.cadcraft.dev. Runs only in the withshalom/cadcraft-dev fork, whose Pages site owns that
# domain (one custom domain per repo; withshalom/cadcraft keeps cadcraft.dev for the `web` branch).
name: mobile-deploy

on:
  push:
    branches: [mobile]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CUSTOM_DOMAIN: mobile.cadcraft.dev

jobs:
  build:
    if: github.repository == 'withshalom/cadcraft-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build (release)
        working-directory: apps/cadcraft-web
        shell: bash
        run: |
          set -o pipefail
          if ! trunk build --release 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # The step log needs a sign-in to read; echo the first compiler errors as an annotation.
            msg=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/build.log" | grep -E -A14 -m4 '^error(\[E[0-9]+\])?: ' | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Build failed::${msg}"
            exit 1
          fi

      - name: Check the site uses relative URLs
        run: |
          test -f dist/web/index.html
          if grep -Eq '(src|href)="/[^/]' dist/web/index.html; then
            echo "index.html has root-absolute URLs" >&2
            exit 1
          fi

      - name: Add Pages files
        run: |
          touch dist/web/.nojekyll
          echo "$CUSTOM_DOMAIN" > dist/web/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    if: github.repository == 'withshalom/cadcraft-dev'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
