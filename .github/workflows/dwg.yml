# The DWG bridge (crates/dwg) and the crate that reads and writes files through it (crates/io):
# format, lint and tests on Linux, and the bridge built for the web, on every change to them.
name: DWG

on:
  push:
    branches: [main]
    paths: ["crates/dwg/**", "crates/io/**", "Cargo.toml", "Cargo.lock", ".github/workflows/dwg.yml"]
  pull_request:
    paths: ["crates/dwg/**", "crates/io/**", "Cargo.toml", "Cargo.lock", ".github/workflows/dwg.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dwg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dwg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Format
        run: cargo fmt -p cadcraft-dwg -p cadcraft-io -- --check
      - name: Lint
        run: cargo clippy --locked -p cadcraft-dwg -p cadcraft-io --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -p cadcraft-dwg -p cadcraft-io
      - name: Web
        run: cargo check --locked -p cadcraft-dwg --target wasm32-unknown-unknown
