      PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
      SOUNDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      SOUNDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      SOUNDCRAFT_BUILD_SHA: ${{ github.sha }}
      VECTORCRAFT_VERSION: ${{ needs.version.outputs.version }}
      VECTORCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      VECTORCRAFT_BUILD_SHA: ${{ github.sha }}
      WORDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      WORDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      WORDCRAFT_BUILD_SHA: ${{ github.sha }}
      FIGCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FIGCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FIGCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the Flatpak bundle
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          # The app's own tarball: <file-prefix>-<version>-linux-<arch>.tar.gz. The file prefix can
          # differ from app-name (craft-launcher ships artcraft-launcher-*), and CLI or server
          # tarballs (pdfcraft-cli-*, figcraft-server-*) sit beside it.
          tarballs=()
          for f in dist/linux/*-"${RELEASE_VERSION}"-linux-"${ARCH}".tar.gz; do
            case "${f##*/}" in *-cli-*|*-server-*) ;; *) tarballs+=("$f") ;; esac
          done
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected one app tarball for ${RELEASE_VERSION} in release-linux-${ARCH}, found ${#tarballs[@]}: ${tarballs[*]}"
            exit 1
          fi
          tarball="${tarballs[0]}"
          packaging/linux/flatpak-bundle.sh "$tarball"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: dist/release/*.flatpak
          if-no-files-found: error

  arch:
    name: Arch Linux ${{ matrix.arch }}
    needs: [version, linux]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux
      - name: Find the release tarball
        id: tarball
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          # The app's own tarball: <file-prefix>-<version>-linux-<arch>.tar.gz. The file prefix can
          # differ from app-name (craft-launcher ships artcraft-launcher-*), and CLI or server
          # tarballs (pdfcraft-cli-*, figcraft-server-*) sit beside it.
          tarballs=()
          for f in dist/linux/*-"${RELEASE_VERSION}"-linux-"${ARCH}".tar.gz; do
            case "${f##*/}" in *-cli-*|*-server-*) ;; *) tarballs+=("$f") ;; esac
          done
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected one app tarball for ${RELEASE_VERSION} in release-linux-${ARCH}, found ${#tarballs[@]}: ${tarballs[*]}"
            exit 1
          fi
          tarball="${tarballs[0]}"
          echo "path=$tarball" >>"$GITHUB_OUTPUT"
      - uses: storytold/craft-common-actions/actions/arch-package@fa5ef18780cf5e7d5d3b8de068de56cffc83cac5
        with:
          tarball: ${{ steps.tarball.outputs.path }}
          arch: ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-arch-${{ matrix.arch }}
          path: dist/release/*.pkg.tar.zst
          if-no-files-found: error

