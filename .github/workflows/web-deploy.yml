# Builds the browser version (apps/cadcraft-web, wasm via Trunk) and publishes it to GitHub Pages.
# Runs only for the `web` branch of this fork, so `main` can stay a pure mirror of upstream.
name: web-deploy

on:
  push:
    branches: [web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CUSTOM_DOMAIN: cadcraft.dev

jobs:
  build:
    # Only in the main fork; the cadcraft-dev fork serves mobile.cadcraft.dev from its own branch.
    if: github.repository == 'withshalom/cadcraft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build (release)
        working-directory: apps/cadcraft-web
        run: trunk build --release

      - name: Check the site uses relative URLs
        run: |
          test -f dist/web/index.html
          if grep -Eq '(src|href)="/[^/]' dist/web/index.html; then
            echo "index.html has root-absolute URLs" >&2
            exit 1
          fi

      - name: Add Pages files
        run: |
          touch dist/web/.nojekyll
          echo "$CUSTOM_DOMAIN" > dist/web/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    if: github.repository == 'withshalom/cadcraft'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
